name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-flight run for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `postinstall` runs `prisma generate` — typed Prisma client is required
      # for the typecheck below to succeed.
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit

  frontend:
    name: frontend (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Frontend needs --legacy-peer-deps because tslint-language-service and
      # codelyzer disagree on tslint peer ranges (see CLAUDE.md lesson #8).
      - run: npm ci --legacy-peer-deps
      - run: npx tsc -p src/tsconfig.app.json --noEmit

      # Karma tests are intentionally skipped here — there are no `.spec.ts`
      # files in the codebase yet. Re-enable this step once tests exist:
      #   - run: npm test -- --watch=false --browsers=ChromeHeadless
